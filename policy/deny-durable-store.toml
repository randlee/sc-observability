# D29/D32 audit for the durable-store and CLI graphs; retire when covered by
# a workspace-wide audit. Advisories and yanked crates fail by default.
[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "allow"
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
# Only SQLite ABI duplication is forbidden by this scoped contract.
deny = [{ crate = "libsqlite3-sys", deny-multiple-versions = true }]
