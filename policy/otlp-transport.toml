# ADR-019 transport allowlist. Both existing dependency validators consume
# these exact workspace pins, effective features, and backend bindings.
[transport.opentelemetry]
version = "=0.33.0"
backends = ["otlp-sdk"]
features = []
default_features = true

[transport.opentelemetry_sdk]
version = "=0.33.0"
backends = ["otlp-sdk"]
features = ["rt-tokio"]
default_features = true

[transport.opentelemetry-otlp]
version = "=0.33.0"
backends = ["otlp-sdk"]
features = ["trace", "metrics", "logs", "grpc-tonic", "tls-ring", "tls-webpki-roots", "http-proto", "reqwest-client", "reqwest-rustls"]
default_features = false

[transport.opentelemetry-proto]
version = "=0.33.0"
backends = ["otlp-sdk"]
features = ["gen-tonic", "trace", "metrics", "logs"]
default_features = false

[transport.tonic]
version = "=0.14.6"
backends = ["otlp-sdk"]
features = ["transport"]
default_features = false

[transport.prost]
version = "=0.14.4"
backends = ["otlp-sdk"]
features = ["std"]
default_features = false

[transport.reqwest]
version = "=0.12.28"
backends = ["otlp-sdk", "legacy-http-json"]
features = ["blocking", "json", "rustls-tls"]
default_features = false

[transport.httpdate]
version = "=1.0.3"
backends = ["legacy-http-json"]
features = []
default_features = true

[transport.getrandom]
version = "=0.4.3"
backends = ["legacy-http-json"]
features = []
default_features = true

[transport.tokio]
version = "=1.53.1"
backends = ["otlp-sdk", "legacy-http-json"]
features = ["rt", "rt-multi-thread", "macros", "time", "sync"]
default_features = true

# SDK transport implementation pins resolved by the reviewed Cargo.lock.
[sdk_transport_lock]
opentelemetry-http = "0.33.0"
opentelemetry-proto = "0.33.0"
prost = "0.14.4"
reqwest = "0.13.5"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-types = "0.14.6"
