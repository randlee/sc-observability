# ADR-019 transport allowlist. Both existing dependency validators consume
# these exact workspace pins, effective features, and backend bindings.
[transport.opentelemetry]
version = "=0.33.0"
backends = ["otlp-sdk"]
features = []
default_features = true

[transport.opentelemetry_sdk]
version = "=0.33.0"
backends = ["otlp-sdk"]
features = ["rt-tokio"]
default_features = true

[transport.opentelemetry-otlp]
version = "=0.33.0"
backends = ["otlp-sdk"]
features = ["trace", "metrics", "logs", "grpc-tonic", "tls-ring", "tls-webpki-roots", "http-proto", "reqwest-client", "reqwest-rustls"]
default_features = false

[transport.opentelemetry-proto]
version = "=0.33.0"
backends = ["otlp-sdk"]
features = ["gen-tonic", "trace", "metrics", "logs"]
default_features = false

[transport.tonic]
version = "=0.14.6"
backends = ["otlp-sdk"]
features = ["transport"]
default_features = false

[transport.prost]
version = "=0.14.4"
backends = ["otlp-sdk"]
features = ["std"]
default_features = false

[transport.reqwest]
version = "=0.12.28"
backends = ["otlp-sdk", "sync-http"]
features = ["blocking", "json", "rustls-tls"]
default_features = false

[transport.httpdate]
version = "=1.0.3"
backends = ["sync-http"]
features = []
default_features = true

[transport.getrandom]
version = "=0.4.3"
backends = ["sync-http"]
features = []
default_features = true

[transport.tokio]
version = "=1.53.1"
backends = ["otlp-sdk", "sync-http"]
features = ["rt", "rt-multi-thread", "macros", "time", "sync"]
default_features = true

# ADR-019 amendments: facade tests and OTLP hermetic test collector. These are
# the only sc-observability-otlp dev-dependencies, with exact effective features.
# tonic adds the generated-service router to the reviewed transport pin for the
# integration collector; it is never a normal dependency feature or backend.
[dev_dependencies]
sc-observability-types = { features = ["test-double"], default_features = true }
tempfile = { features = [], default_features = true }
sc-observability = { features = [], default_features = true }
sc-observe = { features = [], default_features = true }
tokio = { features = ["rt", "rt-multi-thread", "macros", "time", "test-util"], default_features = true }
tonic = { features = ["router", "transport"], default_features = false }

# SDK transport implementation pins resolved by the reviewed Cargo.lock.
[sdk_transport_lock]
opentelemetry-http = "0.33.0"
opentelemetry-proto = "0.33.0"
prost = "0.14.4"
reqwest = "0.13.5"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-types = "0.14.6"

# ADR-019/ADR-020 composition-harness amendment. The unpublished test harness
# is the only non-OTLP manifest allowed to name tonic and opentelemetry-proto,
# and only as dev-dependencies for its loopback collector fixtures. It may have
# no normal or build dependencies, and no workspace member may depend on it.
# Each dev dependency records its exact effective features and default features.
[composition_harness]
manifest = "tests/sc-observability-composition/Cargo.toml"
package = "sc-observability-composition"

[composition_harness.dev_dependencies]
opentelemetry-proto = { features = ["gen-tonic", "logs", "metrics", "trace"], default_features = false }
sc-observability = { features = [], default_features = true }
sc-observability-log = { features = [], default_features = true }
sc-observability-otlp = { features = ["sync-http", "otlp-sdk"], default_features = true }
sc-observability-types = { features = [], default_features = true }
sc-observe = { features = [], default_features = true }
serde_json = { features = [], default_features = true }
tempfile = { features = [], default_features = true }
tokio = { features = ["macros", "rt", "rt-multi-thread", "time"], default_features = true }
tonic = { features = ["transport"], default_features = false }

[transport.rusqlite]
version = "=0.40.2"
backends = ["durable-store"]
features = ["bundled"]
default_features = false

[transport.serde-saphyr]
version = "=1.3.0"
backends = ["durable-store"]
features = ["deserialize"]
default_features = false

[transport.uuid]
version = "=1.26.1"
backends = ["durable-store"]
features = ["std", "v7"]
default_features = false
