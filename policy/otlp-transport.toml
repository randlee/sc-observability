# ADR-019 transport allowlist. Both existing dependency validators consume
# these exact workspace pins, effective features, and backend bindings.
[transport.opentelemetry]
version = "=0.33.0"
backends = ["otlp-sdk"]
features = []
default_features = true

[transport.opentelemetry_sdk]
version = "=0.33.0"
backends = ["otlp-sdk"]
features = ["rt-tokio"]
default_features = true

[transport.opentelemetry-otlp]
version = "=0.33.0"
backends = ["otlp-sdk"]
features = ["trace", "metrics", "logs"]
default_features = false

[transport.opentelemetry-proto]
version = "=0.33.0"
backends = ["otlp-sdk"]
features = ["gen-tonic", "trace", "metrics", "logs"]
default_features = false

[transport.tonic]
version = "=0.14.6"
backends = ["otlp-sdk"]
features = ["transport"]
default_features = false

[transport.prost]
version = "=0.14.4"
backends = ["otlp-sdk"]
features = ["std"]
default_features = false

[transport.reqwest]
version = "=0.12.28"
backends = ["otlp-sdk", "sync-http"]
features = ["blocking", "json", "rustls-tls"]
default_features = false

[transport.httpdate]
version = "=1.0.3"
backends = ["sync-http"]
features = []
default_features = true

[transport.getrandom]
version = "=0.4.3"
backends = ["sync-http"]
features = []
default_features = true

[transport.bytes]
version = "=1.12.1"
backends = ["sync-http"]
features = []
default_features = true

[transport.futures-executor]
version = "=0.3.34"
backends = ["synchronous-client"]
features = []
default_features = true

[transport.opentelemetry-http]
version = "=0.33.0"
backends = ["synchronous-client"]
features = []
default_features = false

[transport.otel-reqwest]
version = "=0.13.5"
backends = ["synchronous-client"]
features = ["blocking", "rustls"]
default_features = false

[transport.tokio]
version = "=1.53.1"
backends = ["otlp-sdk", "sync-http"]
features = ["rt", "rt-multi-thread", "macros", "time", "sync"]
default_features = true

# SDK transport implementation pins resolved by the reviewed Cargo.lock.
[sdk_transport_lock]
opentelemetry-http = "0.33.0"
opentelemetry-proto = "0.33.0"
prost = "0.14.4"
reqwest = "0.13.5"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-types = "0.14.6"

[transport.rusqlite]
version = "=0.40.2"
backends = ["durable-store"]
features = ["bundled"]
default_features = false

[transport.serde-saphyr]
version = "=1.3.0"
backends = ["durable-store"]
features = ["deserialize"]
default_features = false

[transport.uuid]
version = "=1.26.1"
backends = ["durable-store"]
features = ["std", "v7"]
default_features = false
