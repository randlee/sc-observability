# ADR-009/ADR-023 transport allow-list. Both existing dependency validators consume
# these exact workspace pins, effective features, and feature bindings.
[transport.opentelemetry]
version = "=0.33.0"
backends = ["native", "log-sink", "synchronous-client", "tokio-exporter"]
features = []
default_features = true

[transport.opentelemetry_sdk]
version = "=0.33.0"
backends = ["native", "log-sink", "synchronous-client", "tokio-exporter"]
features = ["rt-tokio"]
default_features = true

[transport.opentelemetry-otlp]
version = "=0.33.0"
backends = ["synchronous-client", "tokio-exporter"]
features = ["trace", "metrics", "logs"]
default_features = false

[transport.opentelemetry-http]
version = "=0.33.0"
backends = ["synchronous-client"]
features = []
default_features = false

[transport.futures-executor]
version = "=0.3.34"
backends = ["synchronous-client"]
features = []
default_features = true

[transport.otel-reqwest]
version = "=0.13.5"
backends = ["synchronous-client"]
features = ["blocking", "rustls"]
default_features = false

[transport.tokio]
version = "=1.53.1"
backends = ["synchronous-client"]
features = ["rt", "rt-multi-thread", "macros", "time", "sync"]
default_features = true

# Synchronous-client transport implementation pins resolved by the reviewed Cargo.lock.
[sdk_transport_lock]
opentelemetry-http = "0.33.0"
opentelemetry-proto = "0.33.0"
prost = "0.14.4"
reqwest = "0.13.5"
