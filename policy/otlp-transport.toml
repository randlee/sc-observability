# ADR-019 transport allowlist. Both existing dependency validators consume
# these dependency names, effective features, and backend bindings.
[transport.opentelemetry]
backends = ["otlp-sdk"]
features = []
default_features = true

[transport.opentelemetry_sdk]
backends = ["otlp-sdk"]
features = ["rt-tokio"]
default_features = true

[transport.opentelemetry-otlp]
backends = ["otlp-sdk"]
features = ["trace", "metrics", "logs", "grpc-tonic", "tls-ring", "tls-webpki-roots", "http-proto", "reqwest-client"]
default_features = false

[transport.opentelemetry-proto]
backends = ["otlp-sdk"]
features = ["gen-tonic", "trace", "metrics", "logs"]
default_features = false

[transport.tonic]
backends = ["otlp-sdk"]
features = ["transport"]
default_features = false

[transport.prost]
backends = ["otlp-sdk"]
features = ["std"]
default_features = false

[transport.reqwest]
backends = ["otlp-sdk", "sync-http"]
features = ["blocking", "json", "rustls-no-provider"]
default_features = false

[transport.rustls]
backends = ["otlp-sdk", "sync-http"]
features = ["ring"]
default_features = false

[transport.httpdate]
backends = ["sync-http"]
features = []
default_features = true

[transport.getrandom]
backends = ["sync-http"]
features = []
default_features = true

[transport.bytes]
backends = ["sync-http"]
features = []
default_features = true

[transport.tokio]
backends = ["otlp-sdk", "sync-http"]
features = ["rt", "rt-multi-thread", "macros", "time", "sync"]
default_features = true

[transport.rusqlite]
backends = ["durable-store"]
features = ["bundled"]
default_features = false

[transport.serde-saphyr]
backends = ["durable-store"]
features = ["deserialize"]
default_features = false

[transport.uuid]
backends = ["durable-store"]
features = ["std", "v7"]
default_features = false
