# License and advisory audit for the otlp-telemetry, CLI and log-sink graphs; retire
# when covered by a workspace-wide audit. Advisories and yanked crates fail by default.
[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "allow"
