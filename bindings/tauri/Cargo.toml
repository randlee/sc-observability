[package]
name = "sc-observability-tauri"
version = "1.4.0"
edition = "2024"
license = "MIT"
rust-version = "1.94.1"
description = "Tauri host adapter for sc-observability language bindings"

[workspace]

[features]
default = ["tauri"]
tauri = ["dep:tauri"]

[dependencies]
sc-observability-binding-runtime = { path = "../../crates/sc-observability-binding-runtime" }
sc-observability-dto = { path = "../../crates/sc-observability-dto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", optional = true, default-features = false }

[dev-dependencies]
serde_json = "1"
