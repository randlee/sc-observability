[package]
repository.workspace = true
homepage.workspace = true
authors.workspace = true
name = "sc-observability-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Owned and host-attached Python runtime bindings for sc-observability"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
otlp-telemetry = ["dep:sc-observability-otlp", "sc-observability-otlp/durable-store"]
# Private validation seam compiled only by the B.4 source-validation wheel.
# It is deliberately absent from normal package builds and public stubs.
test-hooks = ["sc-observability-types/test-double", "sc-observability-binding-runtime/test-hooks"]

[dependencies]
sc-observability-otlp = { version = "=1.5.0", path = "../../../crates/sc-observability-otlp", default-features = false, optional = true }
pyo3 = { version = "=0.30.1", features = ["abi3-py310"] }
sc-observability = { version = "=1.5.0", path = "../../../crates/sc-observability", default-features = false }
sc-observability-binding-runtime = { version = "=1.5.0", path = "../../../crates/sc-observability-binding-runtime" }
sc-observability-dto = { version = "=1.5.0", path = "../../../crates/sc-observability-dto" }
sc-observability-types = { version = "=1.5.0", path = "../../../crates/sc-observability-types", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[lints]
workspace = true
