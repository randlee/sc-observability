[package]
name = "sc-observability-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Owned and host-attached Python runtime bindings for sc-observability"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.29.2", features = ["abi3-py310"] }
sc-observability.workspace = true
sc-observability-binding-runtime = { version = "1.4.0", path = "../../../crates/sc-observability-binding-runtime" }
sc-observability-dto.workspace = true
sc-observability-types.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true
