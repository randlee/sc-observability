name: sanity-telemetry
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [develop, main, 'integrate/*']
  workflow_dispatch:
defaults:
  run:
    shell: bash

jobs:
  importer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install maturin
      - run: maturin build --manifest-path bindings/python/sc-observability-py/Cargo.toml --features pyo3/abi3-py310,pyo3/extension-module,otlp-telemetry,test-hooks --out dist-hooks
      - run: python -m pip install dist-hooks/*.whl pytest pyyaml tzdata
      - name: Run importer tests and reject skips
        run: |
          results="${RUNNER_TEMP}/sanity-telemetry-junit.xml"
          python -m pytest -rs --junitxml="${results}" scripts/sanity-telemetry/tests
          python - "${results}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          skipped = sum(int(suite.get("skipped", "0")) for suite in root.iter("testsuite"))
          if skipped:
              raise SystemExit(f"sanity-telemetry tests skipped: {skipped}")
          print("sanity-telemetry tests skipped: 0")
          PY
