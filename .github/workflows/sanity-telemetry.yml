name: sanity-telemetry
permissions:
  contents: read
on:
  pull_request:
    branches: ["sprint/*", "integrate/*", "fix/*"]
  workflow_dispatch:
jobs:
  importer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install maturin
      - run: maturin build --manifest-path bindings/python/sc-observability-py/Cargo.toml --features pyo3/abi3-py310,pyo3/extension-module,otlp-telemetry,test-hooks --out dist-hooks
      - run: python -m venv .venv-d35 && .venv-d35/bin/pip install dist-hooks/*.whl pytest pyyaml
      - name: Run importer tests and reject skips
        run: |
          results="${RUNNER_TEMP}/sanity-telemetry-junit.xml"
          .venv-d35/bin/python -m pytest -rs --junitxml="${results}" scripts/sanity-telemetry/tests
          .venv-d35/bin/python - "${results}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          skipped = sum(int(suite.get("skipped", "0")) for suite in root.iter("testsuite"))
          if skipped:
              raise SystemExit(f"sanity-telemetry tests skipped: {skipped}")
          print("sanity-telemetry tests skipped: 0")
          PY
