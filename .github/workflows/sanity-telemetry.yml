name: sanity-telemetry
on:
  pull_request:
    branches: ["sprint/**", "integrate/**"]
    paths: ["scripts/sanity-telemetry/**", "bindings/python/sc-observability-py/**", ".github/workflows/sanity-telemetry.yml"]
  workflow_dispatch:
jobs:
  importer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install maturin pytest pyyaml
      - run: maturin build --manifest-path bindings/python/sc-observability-py/Cargo.toml --features pyo3/abi3-py310,pyo3/extension-module,otlp-telemetry,test-hooks --out dist-hooks
      - run: python -m venv .venv-d35 && .venv-d35/bin/pip install dist-hooks/*.whl pytest pyyaml && .venv-d35/bin/python -m pytest -rs scripts/sanity-telemetry/tests
