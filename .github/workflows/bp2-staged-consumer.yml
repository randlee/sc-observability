name: B.P2 staged consumer

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'scripts/ci/prepare_runtime_level_staged_packages.py'
      - 'scripts/ci/validate_runtime_level_*'
      - '.github/workflows/bp2-staged-consumer.yml'
  workflow_dispatch:

jobs:
  staged-consumer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            evidence: macos
          - os: ubuntu-latest
            evidence: ubuntu
          - os: windows-latest
            evidence: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build immutable extracted candidate stage
        run: python3 scripts/ci/prepare_runtime_level_staged_packages.py --version 1.3.0 --output "$RUNNER_TEMP/bp2-stage"
      - name: Qualify isolated baseline and extracted candidate
        run: python3 scripts/ci/validate_runtime_level_staged_consumer.py --version 1.3.0 --stage "$RUNNER_TEMP/bp2-stage" --platform ${{ matrix.evidence }} --result-file bp2-evidence/${{ matrix.evidence }}.json
      - name: Retain immutable stage with result
        if: always()
        run: python3 -c "import os, pathlib, shutil; source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bp2-stage'; target = pathlib.Path('bp2-evidence') / 'stage'; target.parent.mkdir(exist_ok=True); shutil.copytree(source, target, dirs_exist_ok=True) if source.exists() else None"
      - name: Retain platform qualification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bp2-${{ matrix.evidence }}-qualification
          path: bp2-evidence
          if-no-files-found: error
  aggregate-platform-evidence:
    needs: staged-consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bp2-*-qualification
          path: bp2-evidence-download
          merge-multiple: true
      - name: Reject missing platforms or skipped assertions
        run: python3 scripts/ci/validate_runtime_level_platform_evidence.py --evidence-dir bp2-evidence-download
