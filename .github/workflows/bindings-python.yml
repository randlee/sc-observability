name: Python binding runtime

on:
  pull_request:
  push:
    branches: [develop, main, 'integrate/*']
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  python-source-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: Python source runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v5
      - name: Install exact B.4 interpreters
        run: uv python install 3.10 3.12.10
      - name: Validate Python source runtime
        run: |
          B4_PYTHON="$(uv python find 3.10)" \
          B4_GENERATOR_PYTHON="$(uv python find 3.12.10)" \
          bash scripts/ci/validate_python_bindings.sh
