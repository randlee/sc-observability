name: TypeScript/Tauri bindings

on:
  pull_request:
    paths:
      - "bindings/**"
      - "crates/**"
      - "examples/tauri-logging/**"
      - "scripts/ci/**"
      - "scripts/generate_typescript_bindings.py"
      - ".github/workflows/bindings-typescript.yml"
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

jobs:
  schema-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: echo "BINDING_RUNTIME_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - run: python -m pip install mypy==2.3.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Install isolation helper
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Full schema and shared contracts
        run: |
          bash scripts/ci/validate_binding_schema.sh
          bash scripts/ci/validate_dependency_bans.sh
          bash scripts/ci/validate_repo_boundaries.sh
          bash scripts/ci/validate_docs_consistency.sh
      - name: Pack the one npm artifact consumed on every platform
        shell: bash
        run: |
          mkdir -p target/tauri-npm
          npm --prefix bindings/typescript ci --ignore-scripts
          npm --prefix bindings/typescript run build
          npm pack ./bindings/typescript --pack-destination "$PWD/target/tauri-npm"
          python - <<'PYTHON'
          import hashlib,json,os
          from pathlib import Path
          directory=Path('target/tauri-npm')
          archive,=directory.glob('*.tgz')
          (directory/'npm-producer.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'filename':archive.name,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest()},indent=2)+'\n')
          PYTHON
      - name: Package canonical Rust adapter source bundle
        run: |
          python scripts/ci/build_binding_source_bundle.py --root-manifest bindings/tauri/Cargo.toml --output target/tauri-rust-bundle
          tar -czf target/tauri-rust-bundle.tar.gz -C target tauri-rust-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-shared-rust-bundle
          path: target/tauri-rust-bundle.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-shared-npm
          path: target/tauri-npm/
          if-no-files-found: error
  real-ipc-artifacts:
    needs: schema-and-contract
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            bindings/typescript/package-lock.json
            scripts/ci/fixtures/tauri-qualification/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Install Linux webview and isolation dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb bubblewrap
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: actions/download-artifact@v4
        with:
          name: tauri-shared-npm
          path: target/tauri-npm
      - uses: actions/download-artifact@v4
        with:
          name: tauri-shared-rust-bundle
          path: target/tauri-rust-shared
      - name: Validate real IPC from packaged artifacts
        shell: bash
        run: |
          export TAURI_NPM_ARCHIVE="$PWD/target/tauri-npm/$(python -c 'import json; print(json.load(open("target/tauri-npm/npm-producer.json"))["filename"])')"
          tar -xzf target/tauri-rust-shared/tauri-rust-bundle.tar.gz -C target
          export TAURI_RUST_BUNDLE="$PWD/target/tauri-rust-bundle"
          export TAURI_NPM_MANIFEST="$PWD/target/tauri-npm/npm-producer.json"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bash scripts/ci/validate_typescript_bindings.sh --platform
          else
            bash scripts/ci/validate_typescript_bindings.sh --platform
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-qualification-${{ runner.os }}
          path: target/tauri-qualification/
          if-no-files-found: error
  all-platforms:
    needs: [schema-and-contract, real-ipc-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: actions/download-artifact@v4
        with:
          pattern: tauri-qualification-*
          path: target/tauri-platforms
      - name: Reject missing, stale, failed, or altered qualification
        run: python scripts/ci/validate_tauri_platform_evidence.py target/tauri-platforms --source "$GITHUB_SHA"
