name: TypeScript/Tauri bindings

on:
  pull_request:
    paths:
      - "bindings/**"
      - "crates/**"
      - "examples/tauri-logging/**"
      - "scripts/ci/**"
      - "scripts/generate_typescript_bindings.py"
      - ".github/workflows/bindings-typescript.yml"
  workflow_dispatch:

jobs:
  real-ipc-artifacts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            bindings/typescript/package-lock.json
            scripts/ci/fixtures/tauri-qualification/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Install Linux webview and isolation dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb bubblewrap
      - name: Validate real IPC from packaged artifacts
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bash scripts/ci/validate_typescript_bindings.sh --platform
          else
            bash scripts/ci/validate_typescript_bindings.sh --platform
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-qualification-${{ runner.os }}
          path: target/tauri-qualification/
          if-no-files-found: error
  all-platforms:
    needs: real-ipc-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: actions/download-artifact@v4
        with:
          pattern: tauri-qualification-*
          path: target/tauri-platforms
      - name: Reject missing, stale, failed, or altered qualification
        run: python scripts/ci/validate_tauri_platform_evidence.py target/tauri-platforms --source "$GITHUB_SHA"
