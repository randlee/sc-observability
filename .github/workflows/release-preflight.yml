name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version candidate (e.g. 1.0.0 or v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      RELEASE_ARTIFACT_MANIFEST: release/publish-artifacts.toml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Normalize version input
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          raw='${{ github.event.inputs.version }}'
          tag="$raw"
          [[ "$tag" == v* ]] || tag="v${tag}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: '$raw' (expected X.Y.Z or vX.Y.Z)" >&2
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Validate manifest completeness
        run: |
          python3 scripts/release_artifacts.py validate-manifest \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
            --workspace-toml Cargo.toml

      - name: Validate publish_order dependency graph
        run: bash scripts/ci/validate_publish_order.sh

      - name: Validate docs consistency
        run: bash scripts/ci/validate_docs_consistency.sh

      - name: Validate dependency bans
        run: bash scripts/ci/validate_dependency_bans.sh

      - name: Validate version literals
        run: python3 scripts/ci/validate_version_literals.py

      - name: Install nightly toolchain for cargo-public-api
        run: rustup toolchain install nightly

      - name: Validate public API diff visibility
        id: public_api_diff
        run: |
          status=0
          bash scripts/ci/validate_public_api_diff.sh || status=$?
          test "$status" -le 1

      - name: Validate public API semver compatibility
        if: always()
        run: python3 scripts/ci/validate_public_api_semver.py

      - name: Install nightly toolchain for cargo-public-api
        if: always()
        run: rustup toolchain install nightly

      - name: Validate public API documentation approvals
        if: always()
        run: bash scripts/ci/validate_public_api_docs.sh

      - name: Upload public API governance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-preflight-public-api-${{ github.run_id }}-${{ github.sha }}
          path: target/public-api/
          if-no-files-found: error
          retention-days: 14

      - name: Validate repo boundaries
        run: bash scripts/ci/validate_repo_boundaries.sh

      - name: Verify requested version matches workspace
        run: |
          python3 scripts/release_artifacts.py verify-version \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
            --workspace-toml Cargo.toml \
            --version '${{ steps.meta.outputs.release_version }}'

      - name: Stage and verify the complete dependency chain without publication
        run: |
          python3 scripts/ci/prepare_log_staged_packages.py \
            --version '${{ steps.meta.outputs.release_version }}' \
            --output '${{ runner.temp }}/release-stage'

      - name: Qualify isolated staged consumer
        run: |
          python3 scripts/ci/validate_log_staged_consumer.py \
            --version '${{ steps.meta.outputs.release_version }}' \
            --stage '${{ runner.temp }}/release-stage' \
            --source-commit '${{ github.sha }}' \
            --result-file '${{ runner.temp }}/release-evidence/ubuntu.json'

      - name: Retain immutable stage and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-preflight-stage-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-stage
            ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          retention-days: 30
