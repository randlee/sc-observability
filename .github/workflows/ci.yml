name: CI

on:
  pull_request:
    branches: [develop, main, "integrate/*", "sprint/*", "fix/*"]
  push:
    branches: [develop, main, integrate/phase-d]
  workflow_dispatch:
    inputs:
      accepted_base:
        type: string
        required: true
        description: 'Accepted ancestor SHA for immutable API history checks'

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check --all

  clippy:
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy, rustc-dev

      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.4

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ubuntu-clippy-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ubuntu-clippy-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ubuntu-clippy-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      # Retire with obs-d-18 when the deprecated legacy types are removed.
      - name: Check deprecated lint policies in external examples
        run: python3 scripts/ci/check_external_example_deprecated.py

      - name: Check standalone custom sink example
        run: cargo check --locked --manifest-path examples/custom-sink-example/Cargo.toml

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Validate error migration
        run: python3 scripts/ci/validate_error_migration.py

      - name: Check durable-store crate dependency policy
        run: cargo deny --manifest-path crates/sc-observability-otlp/Cargo.toml --features durable-store --locked check --config policy/deny-durable-store.toml licenses bans advisories

      - name: Check Python OTLP dependency policy
        run: cargo deny --manifest-path bindings/python/sc-observability-py/Cargo.toml --features otlp-telemetry --locked check --config policy/deny-durable-store.toml licenses bans advisories

      - name: Check CLI dependency policy
        run: cargo deny --manifest-path crates/sc-otel-cli/Cargo.toml --all-features --locked check --config policy/deny-durable-store.toml licenses bans advisories

  docs-consistency:
    name: docs-consistency (ubuntu)
    needs: [clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Validate canonical plans and generated diagrams
        run: python3 .claude/skills/atm-beads/scripts/validate-plan --ci

      - name: Validate docs consistency
        run: bash scripts/ci/validate_docs_consistency.sh

  version-literals:
    name: version-literals (ubuntu)
    needs: [clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate version literals
        run: python3 scripts/ci/validate_version_literals.py

  manifest-validation:
    name: manifest-validation (ubuntu)
    needs: [clippy, docs-consistency, version-literals]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The compatibility registry test reads the pinned v1.4.1 commit.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install release manifest test runner
        run: python3 -m pip install --disable-pip-version-check --quiet pytest==8.4.2

      - name: Provision pinned publish-kit renderer
        run: |
          python="$(python3 .github/scripts/bootstrap_sc_compose.py --venv "${RUNNER_TEMP}/sc-compose-renderer")"
          echo "SC_COMPOSE_PYTHON=${python}" >> "$GITHUB_ENV"

      - name: Install publish-kit test dependencies
        run: '"$SC_COMPOSE_PYTHON" -m pip install --quiet pytest==8.3.5 PyYAML==6.0.3'

      - name: Run complete installed publish-kit test suite
        run: '"$SC_COMPOSE_PYTHON" -m pytest .github/scripts/tests -q'

      - name: Run staged-package and retry idempotency tests
        run: |
          python3 -m unittest \
            scripts.ci.tests.test_release_wheel_targets \
            scripts.ci.tests.test_prepare_release_staged_packages \
            scripts.ci.tests.test_publish_retry_idempotency

      - name: Validate manifest completeness
        run: |
          python3 .github/scripts/release_artifacts.py validate-manifest \
            --manifest release/publish-artifacts.toml \
            --workspace-toml Cargo.toml

      - name: Validate install contract semantics
        run: python3 scripts/ci/validate_phase_c_install_contract.py

      - name: Validate publish_order dependency graph
        run: |
          python3 .github/scripts/release_artifacts.py validate-publish-order \
            --manifest release/publish-artifacts.toml \
            --workspace-toml Cargo.toml

      - name: Validate dependency bans
        run: bash scripts/ci/validate_dependency_bans.sh

      - name: Validate repo boundaries
        run: bash scripts/ci/validate_repo_boundaries.sh

  test:
    needs: [clippy, manifest-validation]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest"]' || ((github.event_name != 'pull_request' || github.base_ref == 'develop' || github.base_ref == 'main') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]')) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Versioned schema and API tests retain accepted snapshots via git show.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy, rustc-dev

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-test-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-test-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-test-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check log bridge consumer crate
        run: cargo check --locked -p sc-observability-log-consumer-check

      - name: Run Phase E headless integration runner unit tests
        run: |
          python3 -m unittest discover -s scripts/integrate/suites/collector -p test_run.py
          python3 -m unittest discover -s scripts/integrate/suites/rust-consumers -p test_run.py
          python3 -m unittest discover -s scripts/integrate/suites/rust-viewer -p test_run.py
          python3 -m unittest discover -s scripts/integrate/suites/tauri/tests -p test_run.py
          python3 -m unittest discover -s scripts/integrate/suites/wheel-cli-viewer/tests -p test_run.py
          python3 -m unittest discover -s scripts/integrate/suites/wheels/tests -p test_run.py
          python3 -m unittest discover -s scripts/ci/fixtures/otlp/desktop-viewer -p 'test_*.py'

      - name: Run workspace tests
        env:
          SC_API_ACCEPTED_BASE: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || inputs.accepted_base || '' }}
        run: python3 scripts/api/run_unit_tests.py -- cargo test --locked --no-fail-fast --workspace --all-targets

      - name: Run workspace doctests
        run: cargo test --locked --no-fail-fast --workspace --doc

      - name: Run imported log bridge test_hooks feature
        run: cargo test --locked --no-fail-fast -p sc-observability-log --all-targets --features test_hooks

      - name: Run imported log bridge release static-level-cap fixture
        run: cargo test --locked --no-fail-fast -p sc-observability-log --release --features static_level_cap_test --test static_level_cap

      - name: Run imported log bridge release runtime-level fixture
        run: cargo test --locked --no-fail-fast -p sc-observability-log --release --test runtime_level_bridge

  windows-clippy:
    name: clippy (windows-latest top)
    if: github.event_name == 'workflow_dispatch' || ((github.event_name == 'pull_request' && github.head_ref == 'fix/recovery-windows-ci-sweep') || (github.event_name == 'push' && github.ref == 'refs/heads/integrate/phase-d'))
    needs: [fmt]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Versioned schema tests retain accepted SQL snapshots via git show.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy, rustc-dev

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: windows-clippy-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: windows-clippy-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: windows-clippy-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      # Retire with obs-d-18 when the deprecated legacy types are removed.
      - name: Check deprecated lint policies in external examples
        run: python3 scripts/ci/check_external_example_deprecated.py

      - name: Check standalone custom sink example
        run: cargo check --locked --manifest-path examples/custom-sink-example/Cargo.toml

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  windows-test:
    name: test (windows-latest top)
    # Integration pushes already include Windows in the original test matrix.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'fix/recovery-windows-ci-sweep')
    needs: [fmt]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Versioned schema and API tests retain accepted snapshots via git show.
          fetch-depth: 0

      - name: Install Rust toolchain
        id: windows_toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy, rustc-dev

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-test-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-test-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-test-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check log bridge consumer crate
        if: ${{ !cancelled() && steps.windows_toolchain.outcome == 'success' }}
        run: cargo check --locked -p sc-observability-log-consumer-check

      - name: Run workspace tests
        if: ${{ !cancelled() && steps.windows_toolchain.outcome == 'success' }}
        env:
          SC_API_ACCEPTED_BASE: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || inputs.accepted_base || '' }}
        run: python3 scripts/api/run_unit_tests.py -- cargo test --locked --no-fail-fast --workspace --all-targets

      - name: Run OTLP feature unit tests
        if: ${{ !cancelled() && steps.windows_toolchain.outcome == 'success' }}
        run: cargo test --locked --no-fail-fast -p sc-observability-otlp --all-features --lib

      - name: Run workspace doctests
        if: ${{ !cancelled() && steps.windows_toolchain.outcome == 'success' }}
        run: cargo test --locked --no-fail-fast --workspace --doc

      - name: Run imported log bridge test_hooks feature
        if: ${{ !cancelled() && steps.windows_toolchain.outcome == 'success' }}
        run: cargo test --locked --no-fail-fast -p sc-observability-log --all-targets --features test_hooks

      - name: Run imported log bridge release static-level-cap fixture
        if: ${{ !cancelled() && steps.windows_toolchain.outcome == 'success' }}
        run: cargo test --locked --no-fail-fast -p sc-observability-log --release --features static_level_cap_test --test static_level_cap

      - name: Run imported log bridge release runtime-level fixture
        if: ${{ !cancelled() && steps.windows_toolchain.outcome == 'success' }}
        run: cargo test --locked --no-fail-fast -p sc-observability-log --release --test runtime_level_bridge
