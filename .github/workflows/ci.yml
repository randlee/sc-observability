name: CI

on:
  pull_request:
  push:
    branches: [develop, main, 'integrate/*']
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  fmt:
    # Platform-independent text check: Linux only.
    name: lint / format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Check formatting
        run: python scripts/ci/cargo_workspaces.py fmt

  clippy:
    name: lint / clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-native-deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-clippy-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-clippy-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-clippy-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      # Retire with obs-d-18 when the deprecated legacy types are removed.
      - name: Check deprecated lint policies in external examples
        run: python3 scripts/ci/check_external_example_deprecated.py

      - name: Run clippy
        if: ${{ !cancelled() }}
        run: python scripts/ci/cargo_workspaces.py clippy

  docs-consistency:
    # Platform-independent text check: Linux only.
    name: docs-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate docs consistency
        run: bash scripts/ci/validate_docs_consistency.sh

  version-literals:
    # Platform-independent text check: Linux only.
    name: version-literals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate version literals
        run: python3 scripts/ci/validate_version_literals.py

  public-api-governance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: public-api-governance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test desktop viewer harness
        run: python3 -B -m unittest discover -s scripts/ci/fixtures/otlp/desktop-viewer -v

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Install nightly toolchain for cargo-public-api
        run: rustup toolchain install "$(cat scripts/ci/public-api-toolchain)"

      - name: Run public API validator fixtures
        run: python3 -m unittest discover -s scripts/ci/tests -p test_validate_public_api.py -v

      - name: Validate public API diff visibility
        id: public_api_diff

        run: |
          status=0
          bash scripts/ci/validate_public_api_diff.sh || status=$?
          # Exit 1 reports an API change; 2 reports tool-error rows; 3 reports a validator crash.
          if [ "$status" -gt 1 ]; then exit "$status"; fi

      - name: Validate public API semver compatibility

        if: always()
        run: python3 scripts/ci/validate_public_api_semver.py

      - name: Validate public API documentation approvals

        if: always()
        run: bash scripts/ci/validate_public_api_docs.sh

      - name: Upload public API governance reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: public-api-governance-${{ matrix.os }}-${{ github.run_id }}-${{ github.sha }}
          path: target/public-api/
          if-no-files-found: error
          retention-days: 14

  manifest-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: manifest-validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The compatibility registry test reads the pinned v1.4.1 commit.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install release manifest test runner
        run: python3 -m pip install --disable-pip-version-check --quiet -r scripts/ci/python-packaging-requirements.txt PyYAML==6.0.3

      - name: Provision pinned publish-kit renderer
        run: |
          python="$(python3 .github/scripts/bootstrap_sc_compose.py --venv "${RUNNER_TEMP}/sc-compose-renderer")"
          echo "SC_COMPOSE_PYTHON=${python}" >> "$GITHUB_ENV"

      - name: Install publish-kit test dependencies
        run: '"$SC_COMPOSE_PYTHON" -m pip install --quiet pytest==8.3.5 PyYAML==6.0.3'

      - name: Run complete installed publish-kit test suite
        run: '"$SC_COMPOSE_PYTHON" -m pytest .github/scripts/tests -q'

      - name: Run CI script tests
        env:
          CI: "1"
          PYTHONPATH: ${{ github.workspace }}${{ runner.os == 'Windows' && ';' || ':' }}${{ github.workspace }}/scripts/ci
        run: python3 -m pytest scripts/ci/tests -q

      - name: Validate manifest completeness
        run: |
          python3 .github/scripts/release_artifacts.py validate-manifest \
            --manifest release/publish-artifacts.toml \
            --workspace-toml Cargo.toml

      - name: Validate install contract semantics
        run: python3 scripts/ci/validate_phase_c_install_contract.py

      - name: Validate publish_order dependency graph
        run: |
          python3 .github/scripts/release_artifacts.py validate-publish-order \
            --manifest release/publish-artifacts.toml \
            --workspace-toml Cargo.toml

      - name: Validate dependency bans
        run: bash scripts/ci/validate_dependency_bans.sh

      - name: Validate repo boundaries
        run: bash scripts/ci/validate_repo_boundaries.sh

  test:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-native-deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-test-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-test-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-test-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check log bridge consumer crate
        run: cargo check --locked -p sc-observability-log-consumer-check

      - name: Run workspace tests
        if: ${{ !cancelled() }}
        run: python scripts/ci/cargo_workspaces.py unit

      - name: Run standalone Tauri tests with all features
        if: ${{ !cancelled() }}
        run: cargo test --locked --manifest-path bindings/tauri/Cargo.toml --all-features --no-fail-fast

      - name: Run external OTLP SDK fixture
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path examples/otlp-sdk/Cargo.toml --features sdk-fixture --locked --no-fail-fast

      - name: Run workspace doctests
        if: ${{ !cancelled() }}
        run: cargo test --locked --workspace --doc --no-fail-fast

      - name: Run imported log bridge test_hooks feature
        if: ${{ !cancelled() }}
        run: cargo test --locked -p sc-observability-log --all-targets --features test_hooks --no-fail-fast

      - name: Run imported log bridge release static-level-cap fixture
        if: ${{ !cancelled() }}
        run: cargo test --locked -p sc-observability-log --release --features static_level_cap_test --test static_level_cap

      - name: Run imported log bridge release runtime-level fixture
        if: ${{ !cancelled() }}
        run: cargo test --locked -p sc-observability-log --release --test runtime_level_bridge
