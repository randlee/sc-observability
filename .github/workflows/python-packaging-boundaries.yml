name: Python packaging boundaries

on:
  pull_request:
  push:
    branches: [develop, main, 'integrate/*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  boundaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/ci/python-packaging-requirements.txt
      - run: python -m unittest discover -s scripts/ci/tests -p test_python_distribution.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/b4a-python-distributions.yml .github/workflows/python-packaging-boundaries.yml
