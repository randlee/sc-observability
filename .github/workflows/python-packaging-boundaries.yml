name: Python packaging boundaries

on:
  push:
    branches: [feature/phase-b-4a-python-packaging]
  pull_request:
    paths:
      - 'scripts/ci/*python*'
      - 'scripts/ci/tests/test_python_distribution.py'
      - 'release/python-platform-policy.json'
      - '.github/workflows/b4a-python-distributions.yml'
      - '.github/workflows/python-packaging-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/ci/python-packaging-requirements.txt
      - run: python -m unittest discover -s scripts/ci/tests -p test_python_distribution.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/b4a-python-distributions.yml .github/workflows/python-packaging-boundaries.yml
