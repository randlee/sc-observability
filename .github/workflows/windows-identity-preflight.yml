name: Windows proof identity preflight
on:
  workflow_dispatch:
  push:
    branches: [fix/phase-b-wheel-test-hooks]
    paths:
      - scripts/ci/_windows_identity.py
      - scripts/ci/windows_identity_preflight.py
      - .github/workflows/windows-identity-preflight.yml
permissions:
  contents: read
jobs:
  preflight:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - name: Real identity and descendant preflight
        shell: pwsh
        run: python scripts/ci/windows_identity_preflight.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-identity-preflight
          path: target/windows-identity-preflight/
          if-no-files-found: error
