name: Windows proof identity preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
      - name: Real identity and descendant preflight
        shell: pwsh
        run: python scripts/ci/windows_identity_preflight.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-identity-preflight
          path: target/windows-identity-preflight/
          if-no-files-found: error
