name: OTLP conformance

on:
  workflow_dispatch:

jobs:
  collector-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.1'
          components: clippy, rustfmt
      - name: Run the official Collector end-to-end suite against the pinned release
        run: >-
          python3 scripts/integrate/suites/collector/run.py
          --source-sha "$GITHUB_SHA"
          --output-dir "$RUNNER_TEMP/collector-evidence"
