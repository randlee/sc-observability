name: OTLP conformance

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/sc-observability-otlp/**'
      - 'crates/sc-observability-types/**'
      - 'docs/observability/otlp/**'
      - 'docs/plans/phase-d/legacy-otlp-provenance.json'
      - 'policy/otlp-transport.toml'
      - 'scripts/ci/otlp_dependencies.py'
      - 'scripts/ci/otlp_dev_install_smoke.py'
      - 'scripts/ci/provision_legacy_otlp_provenance.py'
      - 'scripts/ci/tests/test_legacy_otlp_provenance.py'
      - 'scripts/ci/fixtures/otlp/**'
      - '.github/workflows/otlp-conformance.yml'
  workflow_dispatch:

jobs:
  collector-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features:
          - otlp-sdk
          - legacy-http-json
          - otlp-sdk,legacy-http-json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.1'
      - name: Run hermetic collector conformance (${{ matrix.features }})
        run: >-
          cargo test --locked -p sc-observability-otlp
          --test full_stack_integration --features ${{ matrix.features }}

      - name: Run the canonical span and histogram corpus through both production backends
        if: matrix.features == 'otlp-sdk,legacy-http-json'
        run: >-
          cargo test --locked -p sc-observability-otlp
          --test canonical_ingress --features otlp-sdk,legacy-http-json
      - name: Validate non-Grafana legacy OTLP provenance
        if: matrix.features == 'otlp-sdk,legacy-http-json'
        run: >-
          python3 -m unittest scripts.ci.tests.test_legacy_otlp_provenance

  desktop-viewer-factory-conformance:
    name: desktop-viewer-factory-conformance (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.1'
      - name: Define owned desktop viewer state
        run: echo "VIEWER_STATE_DIR=$RUNNER_TEMP/sc-observability-d9-viewer" >> "$GITHUB_ENV"
      - name: Read pinned viewer manifest
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path(
              'scripts/ci/fixtures/otlp/desktop-viewer/release.json'
          ).read_text())
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              output.write(f"VIEWER_VERSION={manifest['version']}\n")
              output.write(f"VIEWER_BINARY_SHA256={manifest['binary_sha256']}\n")
          PY
      - name: Download verified pinned desktop viewer
        run: >-
          python3 scripts/ci/fixtures/otlp/desktop-viewer/download_pinned_release.py
          "$RUNNER_TEMP/otel-desktop-viewer"
      - name: Select isolated free viewer ports
        run: |
          python3 - <<'PY'
          import os
          import socket
          from pathlib import Path

          listeners = []
          try:
              for _ in range(3):
                  listener = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  listener.bind(("127.0.0.1", 0))
                  listeners.append(listener)
              ports = [listener.getsockname()[1] for listener in listeners]
          finally:
              for listener in listeners:
                  listener.close()
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              for name, port in zip(("D9_VIEWER_HTTP", "D9_VIEWER_GRPC", "D9_VIEWER_UI"), ports):
                  output.write(f"{name}={port}\n")
          PY
      - name: Start an owned isolated desktop viewer
        run: |
          python3 scripts/ci/fixtures/otlp/desktop-viewer/viewer_harness.py start \
            --binary "$RUNNER_TEMP/otel-desktop-viewer" \
            --version "$VIEWER_VERSION" \
            --binary-sha256 "$VIEWER_BINARY_SHA256" \
            --state-dir "$VIEWER_STATE_DIR" \
            --host 127.0.0.1 --http "$D9_VIEWER_HTTP" \
            --grpc "$D9_VIEWER_GRPC" --ui "$D9_VIEWER_UI"
      - name: Run legacy public factory against the pinned viewer
        run: >-
          D9_VIEWER_LEGACY_ADDRESS=127.0.0.1:$D9_VIEWER_HTTP
          cargo test --locked -p sc-observability-otlp
          --test full_stack_integration --features legacy-http-json
          -- --ignored public_legacy_factory_exports_three_signals_to_the_pinned_desktop_viewer
      - name: Query legacy public-factory output in the pinned viewer
        run: >-
          python3 scripts/ci/fixtures/otlp/desktop-viewer/viewer_harness.py assert-production
          --state-dir "$VIEWER_STATE_DIR" --backend legacy
      - name: Run SDK public factory against the pinned viewer
        run: >-
          D9_VIEWER_SDK_ADDRESS=127.0.0.1:$D9_VIEWER_GRPC
          cargo test --locked -p sc-observability-otlp
          --test full_stack_integration --features otlp-sdk
          -- --ignored public_sdk_factory_exports_three_signals_to_the_pinned_desktop_viewer
      - name: Query SDK public-factory output in the pinned viewer
        run: >-
          python3 scripts/ci/fixtures/otlp/desktop-viewer/viewer_harness.py assert-production
          --state-dir "$VIEWER_STATE_DIR" --backend sdk
      - name: Remove the owned desktop viewer state
        if: always()
        run: |
          if [ -d "$VIEWER_STATE_DIR" ]; then
            python3 scripts/ci/fixtures/otlp/desktop-viewer/viewer_harness.py stop \
              --state-dir "$VIEWER_STATE_DIR" --remove-state
          fi
