name: B.4a Python distribution qualification

on:
  workflow_dispatch:
    inputs:
      source_commit:
        type: string
        required: true
        description: 'Full immutable source SHA to qualify'
      development:
        type: boolean
        default: false
        description: 'Exercise platform builds with incomplete runtime; aggregate rejects all development results'
  workflow_call:
    inputs:
      source_commit:
        type: string
        required: true
        description: 'Full immutable source SHA to qualify'
    outputs:
      qualified_source_commit:
        description: 'Exact successfully qualified source SHA'
        value: ${{ jobs.aggregate.outputs.source_commit }}
      inventory_sha256:
        description: 'SHA256 of production-artifacts.json'
        value: ${{ jobs.aggregate.outputs.inventory_sha256 }}
      production_inventory_artifact_id:
        description: 'Actions artifact ID containing production-artifacts.json'
        value: ${{ jobs.aggregate.outputs.inventory_artifact_id }}
      production_inventory_artifact_name:
        description: 'Actions artifact name containing production-artifacts.json'
        value: b4a-production-inventory

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      platforms: ${{ steps.matrix.outputs.platforms }}
      cells: ${{ steps.matrix.outputs.cells }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_commit }}
      - id: source
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
        run: |
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_SOURCE"
          echo "commit=$actual" >> "$GITHUB_OUTPUT"
      - id: matrix
        shell: python
        run: |
          import json, os, sys
          sys.path.insert(0, 'scripts/ci')
          from python_arm64 import apply_windows_arm64_overlay
          policy = json.load(open('release/python-platform-policy.json'))
          ids = {platform['id'] for platform in policy['platforms']}
          assert len(ids) == len(policy['platforms'])
          apply_windows_arm64_overlay(policy)
          cells = [{**platform, 'python': version} for platform in policy['platforms'] for version in platform.get('interpreters', policy['interpreters'])]
          assert len(policy['platforms']) == 6
          assert len(cells) == 29
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('platforms=' + json.dumps(policy['platforms']) + '\n')
              out.write('cells=' + json.dumps(cells) + '\n')

  sdist:
    needs: plan
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
          components: clippy, rustfmt
      - run: python -m pip install -r scripts/ci/python-packaging-requirements.txt
      - name: Build sole-helper source bundle and immutable maturin sdist
        shell: bash
        env:
          B4A_DEVELOPMENT: ${{ inputs.development }}
        run: |
          flags=()
          if [[ "$B4A_DEVELOPMENT" == true ]]; then flags+=(--allow-incomplete-runtime); fi
          python scripts/ci/prepare_python_distributions.py --output target/b4a-sdist "${flags[@]}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: b4a-sdist
          path: |
            target/b4a-sdist/dist/*.tar.gz
            target/b4a-sdist/sdist-result.json
            target/b4a-sdist/prepare.log
          if-no-files-found: error
          retention-days: 90

  wheel:
    timeout-minutes: 45
    needs: [plan, sdist]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.build_python || '3.10' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
          components: clippy, rustfmt
      - if: matrix.id == 'windows-arm64'
        name: Reject emulated Windows ARM64 build evidence
        shell: pwsh
        run: python scripts/ci/python_arm64.py
      - if: matrix.id == 'windows-arm64'
        name: Provision Windows ARM64 Rust target
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc
      - uses: actions/download-artifact@v7
        with:
          name: b4a-sdist
          path: ${{ runner.temp }}/b4a-source
      - if: runner.os != 'Linux'
        run: python -m pip install -r scripts/ci/python-packaging-requirements.txt
      - if: runner.os == 'Linux'
        name: Provision native manylinux_2_28 build tools before isolation
        run: docker build --build-arg BASE_IMAGE=${{ matrix.container }} -f scripts/ci/Dockerfile.python-manylinux -t b4a-manylinux .
      - name: External offline wheel and separate-link embedding proof
        shell: bash
        env:
          B4A_PLATFORM: ${{ matrix.id }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            mkdir -p "$RUNNER_TEMP/b4a-result"
            docker run --rm --cap-add SYS_ADMIN --cap-add NET_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
              -v "$GITHUB_WORKSPACE:/checkout:ro" -v "$RUNNER_TEMP/b4a-source:/artifacts:ro" \
              -v "$RUNNER_TEMP/b4a-result:/result" -e B4A_PLATFORM b4a-manylinux \
              bash -c 'set -e; sdist=(/artifacts/dist/*.tar.gz); bash /checkout/scripts/ci/validate_python_bindings.sh --distribution build --sdist "${sdist[0]}" --platform "$B4A_PLATFORM" --checkout /checkout --output /result/wheel; chmod -R a+rX /result'
          elif [[ "$RUNNER_OS" == Windows ]]; then
            sdist=( "$RUNNER_TEMP"/b4a-source/dist/*.tar.gz )
            python scripts/ci/supervise_windows_proof.py --evidence "$RUNNER_TEMP/b4a-result/wheel" -- \
              python scripts/ci/validate_python_distribution.py build --sdist "${sdist[0]}" \
              --platform "$B4A_PLATFORM" --checkout "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/b4a-result/wheel"
          else
            sdist=( "$RUNNER_TEMP"/b4a-source/dist/*.tar.gz )
            bash scripts/ci/validate_python_bindings.sh --distribution build --sdist "${sdist[0]}" \
              --platform "$B4A_PLATFORM" --checkout "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/b4a-result/wheel"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: b4a-wheel-${{ matrix.id }}
          path: ${{ runner.temp }}/b4a-result/wheel/
          if-no-files-found: error
          retention-days: 90

  installed-suite:
    timeout-minutes: 30
    needs: [plan, sdist, wheel]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cells) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
          components: clippy, rustfmt
      - if: matrix.id == 'windows-arm64'
        name: Reject emulated Windows ARM64 installed cell
        shell: pwsh
        run: python scripts/ci/python_arm64.py
      - uses: actions/download-artifact@v7
        with:
          name: b4a-sdist
          path: ${{ runner.temp }}/b4a-source
      - uses: actions/download-artifact@v7
        with:
          name: b4a-wheel-${{ matrix.id }}
          path: ${{ runner.temp }}/b4a-wheel
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
      - run: python -m pip install -r scripts/ci/python-packaging-requirements.txt
      - name: Execute full installed B.4 suite and stubs with checkout/network/cache denied
        shell: bash
        env:
          B4A_DEVELOPMENT: ${{ inputs.development }}
        run: |
          flags=()
          if [[ "$B4A_DEVELOPMENT" == true ]]; then flags+=(--allow-incomplete-runtime); fi
          sdist=( "$RUNNER_TEMP"/b4a-source/dist/*.tar.gz )
          wheel=( "$RUNNER_TEMP"/b4a-wheel/*.whl )
          shopt -s nullglob
          companion=( "$RUNNER_TEMP"/b4a-wheel/instrumented/*.whl )
          if (( ${#companion[@]} == 1 )); then flags+=(--instrumented-wheel "${companion[0]}"); fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            python scripts/ci/supervise_windows_proof.py --evidence "$RUNNER_TEMP/b4a-cell" -- \
              python scripts/ci/validate_python_distribution.py cell --sdist "${sdist[0]}" --wheel "${wheel[0]}" \
              --checkout "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/b4a-cell" "${flags[@]}"
          else
            bash scripts/ci/validate_python_bindings.sh --distribution cell --sdist "${sdist[0]}" --wheel "${wheel[0]}" \
              --checkout "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/b4a-cell" "${flags[@]}"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: b4a-cell-${{ matrix.id }}-${{ matrix.python }}
          path: ${{ runner.temp }}/b4a-cell/
          if-no-files-found: error
          retention-days: 90

  public-api-surface:
    # ADR-022: one native producer per release platform renders the compiled
    # public API of every published crate for every feature selection; the
    # aggregate compares the six surfaces.
    timeout-minutes: 120
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
      - if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-native-deps
      - if: matrix.id == 'windows-arm64'
        name: Reject emulated Windows ARM64 API extraction
        shell: pwsh
        run: python scripts/ci/python_arm64.py
      - name: Install the pinned rustdoc nightly and the fixture targets
        shell: bash
        run: |
          toolchain="$(cat scripts/ci/public-api-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup target add --toolchain "$toolchain" x86_64-unknown-linux-gnu x86_64-pc-windows-msvc
      - name: Prove the extractor detects target-conditioned API mutations
        shell: bash
        env:
          CI: '1'
        run: python -m unittest discover -s scripts/ci/tests -p test_public_api_parity.py -v
      - name: Render the compiled public API of every published crate for this release target
        shell: bash
        run: |
          python scripts/ci/public_api_parity.py collect --platform-id "${{ matrix.id }}" \
            --output "$RUNNER_TEMP/b4a-public-api"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: b4a-public-api-${{ matrix.id }}
          path: ${{ runner.temp }}/b4a-public-api/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    if: always()
    needs: [plan, sdist, wheel, installed-suite, public-api-surface]
    outputs:
      source_commit: ${{ needs.plan.outputs.source_commit }}
      inventory_sha256: ${{ steps.qualify.outputs.sha256 }}
      inventory_artifact_id: ${{ steps.inventory.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
      - run: python -m pip install -r scripts/ci/python-packaging-requirements.txt
      - uses: actions/download-artifact@v7
        with:
          pattern: b4a-*
          path: ${{ runner.temp }}/b4a-evidence
      - name: Require an identical public API across all release targets (ADR-022)
        shell: bash
        run: |
          python scripts/ci/public_api_parity.py compare --evidence "$RUNNER_TEMP/b4a-evidence" \
            --source-commit "${{ needs.plan.outputs.source_commit }}" \
            --report "$RUNNER_TEMP/b4a-public-api-parity/report.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: b4a-public-api-parity-report
          path: ${{ runner.temp }}/b4a-public-api-parity/
          if-no-files-found: error
          retention-days: 90
      - name: Require all policy cells against the same wheels and sdist
        id: qualify
        shell: bash
        run: |
          sdist=( "$RUNNER_TEMP"/b4a-evidence/b4a-sdist/dist/*.tar.gz )
          python - <<'PYTHON'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/ci')
          from python_arm64 import apply_windows_arm64_overlay
          policy_path = Path('release/python-platform-policy.json')
          policy = json.loads(policy_path.read_text())
          apply_windows_arm64_overlay(policy)
          (Path(os.environ['RUNNER_TEMP']) / 'b4a-policy.json').write_text(json.dumps(policy))
          PYTHON
          python scripts/ci/validate_python_distribution.py aggregate \
            --policy "$RUNNER_TEMP/b4a-policy.json" --sdist "${sdist[0]}" \
            --evidence "$RUNNER_TEMP/b4a-evidence" --source-commit "${{ needs.plan.outputs.source_commit }}" \
            --publication-dir "$RUNNER_TEMP/b4a-production" \
            --output "$RUNNER_TEMP/b4a-production/production-artifacts.json"
          python - <<'PYTHON'
          import hashlib, os
          from pathlib import Path
          inventory = Path(os.environ['RUNNER_TEMP']) / 'b4a-production/production-artifacts.json'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha256=' + hashlib.sha256(inventory.read_bytes()).hexdigest() + '\n')
          PYTHON
      - uses: actions/upload-artifact@v6
        id: inventory
        with:
          name: b4a-production-inventory
          path: ${{ runner.temp }}/b4a-production/
          if-no-files-found: error
          retention-days: 90
