name: Binding runtime
on:
  pull_request:
  push:
    branches: [develop, main, 'integrate/*']
  workflow_dispatch:
defaults:
  run:
    shell: bash

jobs:
  native-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - name: Complete debug and release native contract
        shell: bash
        run: bash scripts/ci/validate_binding_runtime.sh --platform-only
      - name: Retain complete platform proof
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: binding-runtime-${{ matrix.os }}
          path: target/binding-runtime-platforms
          if-no-files-found: error
      - name: Retain failed platform logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: binding-runtime-failure-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/binding-runtime-platforms
          if-no-files-found: warn
  packaged-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - name: Install Linux isolation helper
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Verify offline packaged core and bridge consumer in sandbox
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            python scripts/ci/supervise_windows_proof.py --evidence target/binding-consumer-supervisor -- python scripts/ci/validate_binding_runtime.py --consumer-only
          else
            bash scripts/ci/validate_binding_runtime.sh --consumer-only
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: binding-consumer-${{ matrix.os }}
          path: |
            target/binding-runtime-consumer.json
            target/binding-runtime-bundle-manifest.json
          if-no-files-found: error
  complete-gate:
    needs: [native-contract, packaged-consumer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v7
        with:
          pattern: binding-runtime-*-latest
          path: target/binding-runtime-platforms
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: binding-consumer-ubuntu-latest
          path: target/binding-consumer-ubuntu-latest
      - uses: actions/download-artifact@v7
        with:
          name: binding-consumer-macos-latest
          path: target/binding-consumer-macos-latest
      - uses: actions/download-artifact@v7
        with:
          name: binding-consumer-windows-latest
          path: target/binding-consumer-windows-latest
      - name: Reject missing, stale, skipped or altered evidence
        run: >-
          bash scripts/ci/validate_binding_runtime.sh --aggregate-only
          --consumer-evidence target/binding-consumer-ubuntu-latest/binding-runtime-consumer.json
          --consumer-evidence target/binding-consumer-macos-latest/binding-runtime-consumer.json
          --consumer-evidence target/binding-consumer-windows-latest/binding-runtime-consumer.json
