name: Binding schema
on:
  pull_request:
    paths:
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'crates/sc-observability-types/**'
      - 'crates/sc-observability-dto/**'
      - 'bindings/**'
      - 'scripts/*binding*'
      - 'scripts/ci/*binding*'
      - 'scripts/ci/_*sandbox*'
      - 'scripts/ci/_log_staging.py'
      - 'scripts/ci/tests/*binding*'
      - 'scripts/ci/fixtures/**'
      - '.github/workflows/binding-schema.yml'
  push:
    branches: [develop, main, 'integrate/*']
  workflow_dispatch:
jobs:
  binding-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Retain minimum runtime interpreter
        run: echo "BINDING_RUNTIME_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - name: Install pinned typing checker
        run: python -m pip install mypy==2.3.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install isolation helper
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Validate DTO, frozen schema, generators and isolated bundle
        run: bash scripts/ci/validate_binding_schema.sh
      - name: Enforce neutral dependency boundary
        run: bash scripts/ci/validate_dependency_bans.sh
      - name: Retain exact isolated consumer proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: binding-source-bundle-proof
          path: target/b3-bundle-evidence.json
          if-no-files-found: error
