name: Binding schema
on:
  pull_request:
  push:
    branches: [develop, main, 'integrate/*']
  workflow_dispatch:
defaults:
  run:
    shell: bash

jobs:
  binding-schema:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Retain minimum runtime interpreter
        run: echo "BINDING_RUNTIME_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - name: Install pinned typing checker
        run: python -m pip install mypy==2.3.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install isolation helper
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Validate DTO, frozen schema and generators
        run: bash scripts/ci/validate_binding_schema.sh --schema-only
      - name: Enforce neutral dependency boundary
        run: bash scripts/ci/validate_dependency_bans.sh
      # Bundle isolation currently supports sandbox-exec and bubblewrap only.
      - name: Validate isolated source bundle
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: bash scripts/ci/validate_binding_schema.sh --bundle-only
      - name: Retain exact isolated consumer proof
        if: ${{ always() && runner.os != 'Windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: binding-source-bundle-proof-${{ matrix.os }}
          path: target/b3-bundle-evidence.json
          if-no-files-found: error
