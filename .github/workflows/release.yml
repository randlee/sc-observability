name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0 or v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_ARTIFACT_MANIFEST: release/publish-artifacts.toml

jobs:
  gate-and-tag:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Normalize version input
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          raw='${{ github.event.inputs.version }}'
          tag="$raw"
          [[ "$tag" == v* ]] || tag="v${tag}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: '$raw' (expected X.Y.Z or vX.Y.Z)" >&2
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify requested version matches workspace
        run: |
          python3 scripts/release_artifacts.py verify-version \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
            --workspace-toml Cargo.toml \
            --version '${{ steps.meta.outputs.release_version }}'

      - name: Ensure tag is correct or create it
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune --tags
          tag='${{ steps.meta.outputs.release_tag }}'
          main_sha="$(git rev-parse origin/main)"
          remote_tag_sha="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}' || true)"
          if [[ -n "$remote_tag_sha" ]]; then
            if [[ "$remote_tag_sha" == "$main_sha" ]]; then
              echo "Tag ${tag} already exists and points to origin/main (${main_sha}), skipping creation"
              exit 0
            fi
            echo "Tag ${tag} exists but points to ${remote_tag_sha}, not origin/main (${main_sha})" >&2
            exit 1
          fi
          git tag "$tag" origin/main
          git push origin "$tag"

  publish:
    needs: gate-and-tag
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate-and-tag.outputs.release_tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Publish crates in order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # NOTE: the plan is captured into a variable first (not read via
          # `done < <(...)` process substitution). Under `set -euo pipefail`,
          # a failure inside `<(...)` does NOT propagate to the enclosing
          # while loop or this step -- the loop would just silently see
          # zero/partial lines and the step would exit 0. Capturing via
          # `plan="$(...)"` does propagate failure under `set -e`, so a
          # broken manifest/script here now actually fails the job instead
          # of silently publishing nothing.
          plan="$(python3 scripts/release_artifacts.py list-publish-plan --manifest "${RELEASE_ARTIFACT_MANIFEST}")"
          while IFS='|' read -r package wait_secs; do
            cargo publish -p "$package" --locked
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
            python3 scripts/ci/wait_for_registry_version.py \
              --package "$package" --version "$version" --attempts 12 --interval 10
          done <<< "$plan"

  release:
    # Per C04: this now also needs the three B.7 binding-release jobs, not
    # just the 6 core crates' `publish` job. A GitHub Release must never be
    # created before all binding artifacts have been attempted/verified.
    # Today this means `release` cannot run at all: publish-binding-crates,
    # publish-python-wheel, and publish-npm-client are all designed to fail
    # closed (sc-observability-tauri is pending qualification, the npm
    # client is pending "private": true, and PYPI_API_TOKEN/NPM_TOKEN are
    # not configured). That is intentional, not a bug -- per B.7's AC3, a
    # staged/partial artifact set is not closure, and that must hold for
    # the release process itself, not just for documentation. Do not soften
    # this back to `[gate-and-tag, publish]` to "unblock" releases; the fix
    # is to actually resolve the pending items, not to bypass the gate.
    needs: [gate-and-tag, publish, publish-binding-crates, publish-python-wheel, publish-npm-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate-and-tag.outputs.release_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate-and-tag.outputs.release_tag }}
          generate_release_notes: true

  # --- B.7 binding-release jobs (release/bindings-artifacts.toml) ---
  #
  # These jobs are intentionally kept in the workflow file even though
  # neither language package is fully publishable yet. bindings/tauri and
  # bindings/typescript now exist in this branch's tree (merged forward from
  # feature/phase-b-6-python-async), but sc-observability-tauri still needs
  # real qualification (feature/phase-b-tauri-qualification, a separate
  # layer being prepared above B.7) and bindings/typescript/package.json
  # still sets "private": true; npm/PyPI registry credentials are also not
  # provisioned. Direction is to keep npm and all four binding crates in the
  # release machinery now and integrate the real artifacts as they land,
  # rather than gating them out of the workflow.

  publish-binding-crates:
    needs: [gate-and-tag, publish]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate-and-tag.outputs.release_tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate binding manifest
        run: |
          python3 scripts/release_bindings_artifacts.py validate-manifest \
            --manifest release/bindings-artifacts.toml --workspace-toml Cargo.toml

      - name: Verify binding crate versions match workspace
        run: |
          python3 scripts/release_bindings_artifacts.py verify-versions \
            --manifest release/bindings-artifacts.toml --workspace-toml Cargo.toml

      # NOTE: this step is expected to fail closed today. sc-observability-tauri
      # is status = "pending" in release/bindings-artifacts.toml (the crate
      # exists and builds, but real qualification work is a separate layer,
      # feature/phase-b-tauri-qualification, being prepared above B.7), so
      # --require-ready refuses to produce a publish plan. That is correct:
      # this job must never publish a partial 3-of-4 binding crate set. Once
      # that qualification layer lands and sc-observability-tauri flips to
      # "ready", this step (and the cargo publish loop below) will start
      # succeeding with no further changes to this workflow. Because the
      # `release` job now needs this job (see its own comment), that job is
      # also blocked until then -- intentional, not a bug.
      - name: Publish binding crates in order (fails closed until all are ready)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Captured into a variable first, then read via a here-string
          # (`<<<`), not `done < <(...)` process substitution. Under
          # `set -euo pipefail`, a failure inside `<(...)` process
          # substitution does NOT propagate to the enclosing while loop or
          # this step -- the loop would just silently see zero/partial
          # lines and the step would exit 0. `plan="$(...)"` DOES propagate
          # failure under `set -e`, so a genuinely-not-ready manifest (e.g.
          # sc-observability-tauri pending, or an unconfigured registry
          # secret) now actually fails this step instead of silently
          # publishing a partial set or nothing at all.
          plan="$(python3 scripts/release_bindings_artifacts.py list-publish-plan \
                    --manifest release/bindings-artifacts.toml \
                    --workspace-toml Cargo.toml \
                    --require-ready --require-secrets --only-kind crate)"
          while IFS='|' read -r kind package wait_secs status workspace_member manifest_path; do
            if [[ "$workspace_member" == "true" ]]; then
              cargo publish -p "$package" --locked
            else
              # A standalone Cargo workspace (e.g. bindings/tauri/Cargo.toml
              # declares its own empty `[workspace]`, so it is not a root
              # workspace member) cannot be addressed by `cargo publish -p`
              # run from the repo root; --manifest-path addresses it directly.
              cargo publish --manifest-path "$manifest_path" --locked
            fi
            if [[ "$wait_secs" != "0" ]]; then
              sleep "$wait_secs"
            fi
          done <<< "$plan"

  publish-python-wheel:
    needs: [gate-and-tag, publish-binding-crates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate-and-tag.outputs.release_tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      # This job's full 5-platform x 5-interpreter release matrix is built by
      # .github/workflows/b4a-python-distributions.yml's plan -> sdist/wheel
      # matrix -> installed-suite -> aggregate pipeline. That workflow is not
      # currently structured as a reusable `workflow_call` target, so it is
      # not refactored here. This step instead builds and self-verifies a
      # real host-platform sdist/wheel via the same build-evidence/
      # verify-evidence machinery scripts/ci/validate_binding_registry_consumers.sh
      # exercises, so the auth gate and (eventual) upload below act on real,
      # freshly-built, hash-verified bytes rather than a placeholder.
      - name: Build and self-verify candidate evidence for the PyPI package
        run: |
          python3 scripts/release_bindings_artifacts.py build-evidence \
            --manifest release/bindings-artifacts.toml --workspace-toml Cargo.toml \
            --out release/evidence
          python3 scripts/release_bindings_artifacts.py verify-evidence \
            --manifest release/bindings-artifacts.toml --workspace-toml Cargo.toml \
            --evidence release/evidence/bindings-candidate.json

      # Fails closed today (blocked-on-auth): PYPI_API_TOKEN is not yet
      # configured (registry_secret_configured = false for the pypi package
      # in release/bindings-artifacts.toml). This must never be softened to
      # a warning/exit 0 -- a real gate that would legitimately fail today
      # must say so and fail the job, not silently skip.
      - name: Require PyPI publish auth to be configured
        run: |
          python3 scripts/release_bindings_artifacts.py list-publish-plan \
            --manifest release/bindings-artifacts.toml --workspace-toml Cargo.toml \
            --require-ready --require-secrets --only-kind pypi

      - name: Publish to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PYPI_API_TOKEN}" ]]; then
            echo "PYPI_API_TOKEN is not set at the GitHub Actions secrets level even" >&2
            echo "though the manifest gate above passed (registry_secret_configured" >&2
            echo "must be flipped to true only once the secret genuinely exists);" >&2
            echo "refusing to proceed rather than silently skipping." >&2
            exit 1
          fi
          python3 -m pip install --upgrade twine
          sdist=(release/evidence/artifacts/pypi/*.tar.gz)
          wheel=(release/evidence/artifacts/pypi/*.whl)
          twine upload --non-interactive -u __token__ -p "${PYPI_API_TOKEN}" \
            "${sdist[0]}" "${wheel[@]}"

  publish-npm-client:
    needs: [gate-and-tag, publish-binding-crates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate-and-tag.outputs.release_tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Fails closed today: @sc-observability/client is status = "pending" in
      # release/bindings-artifacts.toml (package.json still sets "private":
      # true, and NPM_TOKEN is also not configured) -- --require-ready
      # refuses to produce a publish plan. This must never be softened to a
      # warning/exit 0: per this task's hard constraints, this package
      # cannot be flipped to "ready" from within B.7 (the private:true flag
      # must be cleared upstream first).
      - name: Require the npm client to be ready and its publish auth configured
        run: |
          python3 scripts/release_bindings_artifacts.py list-publish-plan \
            --manifest release/bindings-artifacts.toml --workspace-toml Cargo.toml \
            --require-ready --require-secrets --only-kind npm

      - name: Publish npm client
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NPM_TOKEN}" ]]; then
            echo "NPM_TOKEN is not set at the GitHub Actions secrets level even though" >&2
            echo "the manifest gate above passed; refusing to proceed rather than" >&2
            echo "silently skipping." >&2
            exit 1
          fi
          npm publish --workspace bindings/typescript --access public
