name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0 or v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_ARTIFACT_MANIFEST: release/publish-artifacts.toml

jobs:
  gate-and-tag:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Normalize version input
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          raw='${{ github.event.inputs.version }}'
          tag="$raw"
          [[ "$tag" == v* ]] || tag="v${tag}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: '$raw' (expected X.Y.Z or vX.Y.Z)" >&2
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify requested version matches workspace
        run: |
          python3 scripts/release_artifacts.py verify-version \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
            --workspace-toml Cargo.toml \
            --version '${{ steps.meta.outputs.release_version }}'

      - name: Fail closed for deferred Phase-B inventory
        run: |
          python3 scripts/release_artifacts.py guard-legacy-release \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
            --workspace-toml Cargo.toml

      - name: Ensure tag is correct or create it
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune --tags
          tag='${{ steps.meta.outputs.release_tag }}'
          main_sha="$(git rev-parse origin/main)"
          remote_tag_sha="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}' || true)"
          if [[ -n "$remote_tag_sha" ]]; then
            if [[ "$remote_tag_sha" == "$main_sha" ]]; then
              echo "Tag ${tag} already exists and points to origin/main (${main_sha}), skipping creation"
              exit 0
            fi
            echo "Tag ${tag} exists but points to ${remote_tag_sha}, not origin/main (${main_sha})" >&2
            exit 1
          fi
          git tag "$tag" origin/main
          git push origin "$tag"

  publish:
    needs: gate-and-tag
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate-and-tag.outputs.release_tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Publish crates in order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # NOTE: the plan is captured into a variable first (not read via
          # `done < <(...)` process substitution). Under `set -euo pipefail`,
          # a failure inside `<(...)` does NOT propagate to the enclosing
          # while loop or this step -- the loop would just silently see
          # zero/partial lines and the step would exit 0. Capturing via
          # `plan="$(...)"` does propagate failure under `set -e`, so a
          # broken manifest/script here now actually fails the job instead
          # of silently publishing nothing.
          plan="$(python3 scripts/release_artifacts.py list-publish-plan --manifest "${RELEASE_ARTIFACT_MANIFEST}")"
          while IFS='|' read -r package wait_secs; do
            cargo publish -p "$package" --locked
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
            python3 scripts/ci/wait_for_registry_version.py \
              --package "$package" --version "$version" --attempts 12 --interval 10
          done <<< "$plan"

  release:
    needs: [gate-and-tag, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate-and-tag.outputs.release_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate-and-tag.outputs.release_tag }}
          generate_release_notes: true

  # NOTE: B.7 (bindings/tauri, bindings/typescript, bindings/python) does not
  # install a live publish pipeline in this workflow. Per an explicit owner
  # scope correction, Phase B ends at review readiness -- crates.io/PyPI/npm
  # uploads, registry credentials, and a `release`-job dependency on binding
  # publication are all out of scope here and are deferred to a separate,
  # shared publishing pipeline ("sc-publish") to be installed as a follow-up
  # outside Phase B. The binding-release readiness/evidence tooling this
  # phase produced instead lives in:
  #   - release/bindings-artifacts.toml (readiness manifest)
  #   - scripts/release_bindings_artifacts.py (validate-manifest,
  #     verify-versions, list-publish-plan, build-evidence, verify-evidence)
  #   - scripts/ci/validate_binding_registry_consumers.sh (isolated
  #     consumer-matrix qualification evidence; no live registry involved)
  # None of these dispatch a publish action or upload anything; they only
  # prove structural/hash/consumer readiness for sc-publish to consume later.
