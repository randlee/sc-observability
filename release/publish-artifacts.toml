schema_version = 1

# Phase-B readiness inventory: ten intended publishable Rust crates in
# dependency order. CI-only consumer checks, schema-generator tooling, and
# example applications are intentionally excluded; binding package channels
# and their pending states are detailed in release/bindings-artifacts.toml.

# ATM baseline publish history:
# - sc-observability was previously published at 0.45.2
# - sc-observability-types, sc-observe, and sc-observability-otlp were not
#   previously published under these names

[[crates]]
artifact = "sc-observability-types"
package = "sc-observability-types"
cargo_toml = "crates/sc-observability-types/Cargo.toml"
publish_order = 1
wait_after_publish_seconds = 30

[[crates]]
artifact = "sc-observability"
package = "sc-observability"
cargo_toml = "crates/sc-observability/Cargo.toml"
publish_order = 2
wait_after_publish_seconds = 30

