[workspace]
members = [
  "crates/sc-otel-cli",
  "crates/sc-observability-types",
  "crates/sc-observability",
  "crates/sc-observe",
  "crates/sc-observability-otlp",
  "crates/sc-observability-log",
  "crates/sc-observability-log-macros",
  "crates/sc-observability-log-consumer-check",
  "crates/sc-observability-dto",
  "crates/sc-observability-binding-runtime",
  "bindings/python/sc-observability-py",
  "examples/rust-python-logging",
  "examples/otlp-native",
  "examples/log-settings",
]
resolver = "2"

[workspace.package]
authors = ["Rand Lee"]
version = "1.6.0"
edition = "2024"
license = "MIT"
rust-version = "1.94.1"
repository = "https://github.com/randlee/sc-observability"
homepage = "https://github.com/randlee/sc-observability"

[workspace.dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
sc-observability-dto = { version = "1.6.0", path = "crates/sc-observability-dto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
sc-observability-types = { version = "1.6.0", path = "crates/sc-observability-types", default-features = false }
sc-observability = { version = "1.6.0", path = "crates/sc-observability", default-features = false }
sc-observability-log = { version = "1.6.0", path = "crates/sc-observability-log", default-features = false }
sc-observe = { version = "1.6.0", path = "crates/sc-observe", default-features = false }
sc-observability-otlp = { version = "1.6.0", path = "crates/sc-observability-otlp", default-features = false }
sc-observability-binding-runtime = { version = "1.6.0", path = "crates/sc-observability-binding-runtime", default-features = false }
sc-observability-log-macros = { version = "=1.6.0", path = "crates/sc-observability-log-macros" }
log = { version = "0.4", features = ["std", "kv"] }
hostname = "0.4"
tempfile = "3"
libc = "0.2"
trybuild = "1"
tracing = "0.1"
tokio = { version = "=1.53.1", features = ["rt", "rt-multi-thread", "macros", "time"] }
opentelemetry = "=0.33.0"
opentelemetry_sdk = { version = "=0.33.0", features = ["rt-tokio"] }
opentelemetry-http = { version = "=0.33.0", default-features = false }
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-proto = { version = "=0.33.0", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs"] }
prost = { version = "=0.14.4", default-features = false, features = ["std"] }
futures-executor = "=0.3.34"
# Blocking OTLP/HTTP transport for the synchronous client; the same reqwest
# release opentelemetry-http 0.33.0 implements HttpClient for.
otel-reqwest = { package = "reqwest", version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
pedantic = "warn"
