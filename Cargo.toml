[workspace]
members = [
  "crates/sc-observability-types",
  "crates/sc-observability",
  "crates/sc-observe",
  "crates/sc-observability-otlp",
  "crates/sc-observability-log",
  "crates/sc-observability-log-macros",
  "crates/sc-observability-log-consumer-check",
  "crates/sc-observability-dto",
  "crates/sc-observability-binding-runtime",
  "bindings/python/sc-observability-py",
  "examples/rust-python-logging",
  "examples/log-settings",
]
exclude = ["examples/atm-adapter-example"]
resolver = "2"

[workspace.package]
authors = ["Rand Lee"]
version = "1.4.0"
edition = "2024"
license = "MIT"
rust-version = "1.94.1"
repository = "https://github.com/randlee/sc-observability"
homepage = "https://github.com/randlee/sc-observability"

[workspace.dependencies]
sc-observability-dto = { version = "1.4.0", path = "crates/sc-observability-dto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
sc-observability-types = { version = "1.4.0", path = "crates/sc-observability-types" }
sc-observability = { version = "1.4.0", path = "crates/sc-observability" }
sc-observability-log = { version = "1.4.0", path = "crates/sc-observability-log" }
sc-observe = { version = "1.4.0", path = "crates/sc-observe" }
sc-observability-otlp = { version = "1.4.0", path = "crates/sc-observability-otlp" }
sc-observability-log-macros = { version = "=1.4.0", path = "crates/sc-observability-log-macros" }
log = { version = "0.4", features = ["std", "kv"] }
hostname = "0.4"
tempfile = "3"
trybuild = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
pedantic = "warn"
