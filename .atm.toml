[atm]
default_team = "sc-obs"

# ── rmux: tmux session launcher ──────────────────────────────────────
[rmux]
session = "sc-obs"

# Window 1: core agents (lead + primary codex + QA)
[[rmux.windows]]
name = "agents"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "team-lead"
alias = "obs-lead"
model = "sonnet"
color = "blue"
env = { ATM_IDENTITY = "team-lead", ATM_TEAM = "sc-obs" }

[[rmux.windows.panes]]
name = "cobs"
command = "codex -c features.hooks=true -c model_reasoning_effort=\"high\" --yolo --model gpt-5.6-terra"
env = { ATM_IDENTITY = "cobs", ATM_TEAM = "sc-obs" }

[[rmux.windows.panes]]
name = "quality-mgr"
alias = "obs-quality-mgr"
model = "sonnet"
color = "blue"
env = { ATM_IDENTITY = "quality-mgr", ATM_TEAM = "sc-obs" }

# Window 2: additional workers (luna + astra)
[[rmux.windows]]
name = "workers"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "lobs"
command = "codex -c features.hooks=true -c model_reasoning_effort=\"high\" --yolo --model gpt-5.6-luna"
env = { ATM_IDENTITY = "lobs", ATM_TEAM = "sc-obs" }

[[rmux.windows.panes]]
name = "aobs"
command = "codex -c features.hooks=true --yolo --model gpt-6-astra"
env = { ATM_IDENTITY = "aobs", ATM_TEAM = "sc-obs" }

[[rmux.windows.panes]]
name = "obs-sanity"
command = "codex -c features.hooks=true -c model_reasoning_effort=\"high\" --yolo --model gpt-5.6-terra"
env = { ATM_IDENTITY = "obs-sanity", ATM_TEAM = "sc-obs" }

[startup.team-lead]
all = [
  "Use native atm send or atm ack for messages to cobs, lobs, aobs, quality-mgr, or obs-sanity",
  "Use native atm read to read messages from team-members",
]

[startup.cobs]
all = [
  "Use native atm send or atm ack for messages to team-lead or quality-mgr",
  "Use native atm read to read messages from team-members",
]

[startup.lobs]
all = [
  "Use native atm send or atm ack for messages to team-lead or quality-mgr",
  "Use native atm read to read messages from team-members",
]

[startup.aobs]
all = [
  "Use native atm send or atm ack for messages to team-lead or quality-mgr",
  "Use native atm read to read messages from team-members",
]

[startup.quality-mgr]
all = [
  "read .claude/agents/quality-mgr.md for directive",
  "Use native atm send or atm ack for messages to team-lead, cobs, lobs, or aobs",
  "Use native atm read to read messages from team-members",
]

[startup.obs-sanity]
all = [
  "read .claude/agents/dev-sanity-llm.md for directive",
  "Use native atm send or atm ack for messages to team-lead",
  "Use native atm read to read messages from team-members",
]
