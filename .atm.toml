[atm]
default_team = "sc-obs"

# ── rmux: tmux session launcher ──────────────────────────────────────
[rmux]
session = "sc-obs"

[[rmux.windows]]
name = "agents"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "team-lead"
model = "sonnet"
color = "blue"
env = { ATM_IDENTITY = "team-lead", ATM_TEAM = "sc-obs" }

[[rmux.windows.panes]]
name = "cobs"
command = "codex -c features.hooks=true --yolo"
env = { ATM_IDENTITY = "cobs", ATM_TEAM = "sc-obs" }

[[rmux.windows.panes]]
name = "quality-mgr"
model = "sonnet"
color = "blue"
env = { ATM_IDENTITY = "quality-mgr", ATM_TEAM = "sc-obs" }

[startup.team-lead]
all = [
  "Use native atm send or atm ack for messages to cobs or quality-mgr",
  "Use native atm read to read messages from team-members",
]

[startup.cobs]
all = [
  "Use native atm send or atm ack for messages to team-lead or quality-mgr",
  "Use native atm read to read messages from team-members",
]

[startup.quality-mgr]
all = [
  "read .claude/agents/quality-mgr.md for directive",
  "Use native atm send or atm ack for messages to team-lead or cobs",
  "Use native atm read to read messages from team-members",
]
