[package]
name = "tauri-logging-example"
version = "1.4.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
sc-observability = { path = "../../../crates/sc-observability" }
sc-observability-binding-runtime = { path = "../../../crates/sc-observability-binding-runtime" }
sc-observability-dto = { path = "../../../crates/sc-observability-dto" }
sc-observability-log = { path = "../../../crates/sc-observability-log" }
sc-observability-tauri = { path = "../../../bindings/tauri", features = ["tauri"] }
sc-observability-types = { path = "../../../crates/sc-observability-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["wry"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
