[package]
name = "sc-otel-cli"
publish = false
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Telemetry submission command-line client"

[[bin]]
name = "sc-otel"
path = "src/main.rs"

[dependencies]
sc-observability-otlp = { workspace = true, features = ["synchronous-client"] }
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Loopback TLS collector and its in-process certificate for the trusted-root
# export test.
rcgen = "=0.14.10"
rustls = { version = "=0.23.45", features = ["ring"] }
time.workspace = true

[lints]
workspace = true
