[package]
name = "sc-otel-cli"
publish = false
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Telemetry submission command-line client"

[[bin]]
name = "sc-otel"
path = "src/main.rs"

[dependencies]
sc-observability-types = { version = "=1.5.0", path = "../sc-observability-types", default-features = false }
sc-observability-otlp = { version = "=1.5.0", path = "../sc-observability-otlp", default-features = false, features = ["durable-store"] }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde_json = "=1.0.154"

[dev-dependencies]
tempfile = "=3.27.0"
sc-observability-types = { version = "=1.5.0", path = "../sc-observability-types", default-features = false, features = ["test-double"] }

[lints]
workspace = true
