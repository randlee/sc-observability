[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
temp-env = "0.3.6"
tempfile = "3"
trybuild.workspace = true

[lints]
workspace = true
