[package]
authors.workspace = true
name = "sc-observability-otlp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Standalone OTLP export adapter for sc-observability."

[features]
default = []
otlp-sdk = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-proto", "dep:tokio", "dep:tonic", "dep:prost", "dep:reqwest"]
# Unstable, non-default support for the D.7 external consumer fixture. This
# deliberately does not activate the production Telemetry factory (D.18).
sdk-test-support = ["otlp-sdk"]
legacy-http-json = ["dep:reqwest", "dep:httpdate", "dep:getrandom", "dep:tokio"]

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
sc-observability.workspace = true
sc-observability-types.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-proto = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync"], optional = true }

[dev-dependencies]
sc-observe.workspace = true
# The hermetic conformance collector routes the three generated OTLP services
# in integration tests only; production SDK transport keeps its pinned features.
tonic = { workspace = true, features = ["router"] }

[lints]
workspace = true
