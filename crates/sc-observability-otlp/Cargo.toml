[package]
authors.workspace = true
name = "sc-observability-otlp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Standalone OTLP export adapter for sc-observability."

[features]
durable-store = ["sync-http", "dep:rusqlite", "dep:serde-saphyr", "dep:uuid"]
default = ["v1"]
v1 = ["sc-observability-types/v1"]
otlp-sdk = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-proto", "dep:tokio", "dep:tonic", "dep:prost", "dep:reqwest"]
sync-http = ["dep:reqwest", "dep:httpdate", "dep:getrandom", "dep:bytes", "dep:tokio"]

[dependencies]
sc-lint-attributes = "=0.4.0"
rusqlite = { workspace = true, optional = true }
serde-saphyr = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
sc-observability-types.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-proto = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync"], optional = true }

[dev-dependencies]
sc-observability-types = { workspace = true, features = ["test-double"] }
tempfile.workspace = true
sc-observability.workspace = true
sc-observe.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# The hermetic conformance collector routes the three generated OTLP services
# in integration tests only; production SDK transport keeps its pinned features.
tonic = { workspace = true, features = ["router"] }
rustls = { version = "=0.23.45", features = ["ring"] }

[lints]
workspace = true
