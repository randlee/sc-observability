[package]
authors.workspace = true
name = "sc-observability-otlp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native OpenTelemetry log sink and synchronous OTLP client for sc-observability."

[features]
default = []
# Official OpenTelemetry API/SDK re-exports (`api`, `sdk`) only (ADR-023).
native = ["dep:opentelemetry", "dep:opentelemetry_sdk"]
# Native OpenTelemetry log sink for the core logger (ADR-023); no OTLP transport.
log-sink = ["native", "dep:sc-observability", "dep:serde_json"]
# Blocking OTLP/HTTP protobuf client for CLI and Python frontends (ADR-023).
synchronous-client = ["native", "dep:opentelemetry-otlp", "opentelemetry-otlp/http-proto", "opentelemetry-otlp/reqwest-blocking-client", "opentelemetry-otlp/reqwest-rustls", "dep:opentelemetry-http", "dep:otel-reqwest", "dep:futures-executor", "dep:tokio"]

[dependencies]
serde_json = { workspace = true, optional = true }
sc-observability-types.workspace = true
sc-observability = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-http = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
futures-executor = { workspace = true, optional = true }
otel-reqwest = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync"], optional = true }

[dev-dependencies]
time.workspace = true
tempfile.workspace = true
sc-observability.workspace = true
tokio = { workspace = true }
rustls = { version = "=0.23.45", features = ["ring"] }
rcgen = "=0.14.10"
# Decode the OTLP protobuf requests the synchronous client sends to the
# loopback test collector.
opentelemetry-proto = { workspace = true }
prost = { workspace = true }

[lints]
workspace = true
